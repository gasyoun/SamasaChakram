<text x="89" y="59" font-size="21" text-anchor="middle" fill="currentColor">I часть</text>
<text x="303" y="59" font-size="21" text-anchor="middle" fill="currentColor">II часть</text>
<text y="126" font-size="46" fill="currentColor">
<tspan x="44.0">rāja-</tspan>
<tspan x="136.9">ṛṣi-</tspan>
<tspan x="201.9">vaṃśaḥ</tspan>
</text>

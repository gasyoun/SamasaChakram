<svg viewBox="0 0 932 570" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Klammer Serif', 'Charis SIL', Charis, 'Gentium Plus', Georgia, serif">
<title>Klammerdiagramm — yathāśaktidattānnapānadānapuṇyaphalabhāgī</title>
<desc>German-Indological bracket diagram of the nine-member compound yathā-śakti-datta-anna-pāna-dāna-puṇya-phala-bhāgī with an avyayībhāva inside: A = yathā+śakti (avyayībhāva — pūrvapada-pradhāna in the tradition, yet bound right-to-left like every samāsa per the MG ruling; dvandva remains the sole exception), B = [A]+datta, flat dvandva C = anna·pāna, D = [C]+dāna, joins E = [B]→[D] and G = [E]→[F] over the karmadhāraya F = puṇya+phala, head H = [G]+bhāgī — sharing in the merit-fruit of the gift of food-and-drink given according to ability. II часть begins at puṇya (asked). Unsandhied segmented members, full word form.</desc>

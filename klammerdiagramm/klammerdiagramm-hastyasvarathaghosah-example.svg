<svg viewBox="0 0 549 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Klammer Serif', 'Charis SIL', Charis, 'Gentium Plus', Georgia, serif">
<title>Klammerdiagramm — hastyaśvarathaghoṣaḥ</title>
<desc>German-Indological bracket diagram of the four-member compound hasti-aśva-ratha-ghoṣaḥ with a FLAT dvandva block: coordinate members hasti+aśva+ratha share one band (node A — no internal head, dvandva is coordinate), then B = [A]+ghoṣaḥ, the head taken right-to-left — the din of elephants, horses and chariots. I/II часть spans omitted by choice. Unsandhied segmented members, full word form.</desc>

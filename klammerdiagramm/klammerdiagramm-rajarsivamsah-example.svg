<svg viewBox="0 0 401 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Klammer Serif', 'Charis SIL', Charis, 'Gentium Plus', Georgia, serif">
<title>Klammerdiagramm — rājarṣivaṃśaḥ</title>
<desc>German-Indological bracket diagram of the three-member LEFT-nested compound rāja-ṛṣi-vaṃśaḥ: deepest node A = rāja+ṛṣi (rājarṣi, the king-sage), mirrored node B = [A]+vaṃśaḥ — the lineage of royal sages. II часть begins at vaṃśaḥ (asked, per contract). Unsandhied segmented members, full word form.</desc>

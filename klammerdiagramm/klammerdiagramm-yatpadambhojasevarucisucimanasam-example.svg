<svg viewBox="0 0 804 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Klammer Serif', 'Charis SIL', Charis, 'Gentium Plus', Georgia, serif">
<title>Klammerdiagramm — yatpādāmbhojasevāruciśucimanasām (Leitan comparison)</title>
<desc>The first half-compound of Leitan's Jalhaṇa stanza (Sūktimuktāvalī): yat-pāda-ambhoja-sevā-ruci-śuci-manasām — whose minds are pure through the light of service to the lotus-feet of whom — following Leitan's own right-to-left ladder: upamita pair A = pāda+ambhoja, chain B = yat+[A] (the deepest rung of his indentation), then mirrored accretions C–F: +sevā, +ruci, +śuci, +manasām. II часть at ruci (asked). Drawn for the H982 comparison.</desc>

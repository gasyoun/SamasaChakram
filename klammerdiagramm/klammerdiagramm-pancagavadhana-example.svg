<title>Klammerdiagramm — pañcagavadhanaḥ (Leitan comparison)</title>
<desc>Leitan's dvigu-inside-bahuvrīhi example pañca-gava-dhanaḥ (his vigraha: pañca gāvo dhanaṃ yasya saḥ): dvigu pair A = pañca+gava (numeral-first karmadhāraya subtype, ordinary right-to-left pair), mirrored head B = [A]+dhanaḥ — whose wealth is five cows. II часть at dhanaḥ (asked). Drawn for the H982 comparison.</desc>

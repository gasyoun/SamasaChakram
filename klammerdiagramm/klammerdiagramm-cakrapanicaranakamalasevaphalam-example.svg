<svg viewBox="0 0 781 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Klammer Serif', 'Charis SIL', Charis, 'Gentium Plus', Georgia, serif">
<title>Klammerdiagramm — cakrapāṇicaraṇakamalasevāphalam</title>
<desc>German-Indological bracket diagram of the six-member compound cakra-pāṇi-caraṇa-kamala-sevā-phalam: the bahuvrīhi A = cakra+pāṇi (the Discus-Handed, exocentric — semantics, not structure) and the karmadhāraya B = caraṇa+kamala (the foot-lotus) pre-form on one rung; the directed join C = [A]+[B] takes the head right-to-left (the foot-lotus OF the discus-handed); then D = [C]+sevā and E = [D]+phalam accrete the heads — the fruit of service to the lotus-feet of Viṣṇu. II часть begins at sevā (asked). Unsandhied segmented members, full word form.</desc>

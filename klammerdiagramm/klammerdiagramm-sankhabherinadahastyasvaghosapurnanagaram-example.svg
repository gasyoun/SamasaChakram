<svg viewBox="0 0 957 570" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Klammer Serif', 'Charis SIL', Charis, 'Gentium Plus', Georgia, serif">
<title>Klammerdiagramm — śaṅkhabherīnādahastyaśvaghoṣapūrṇanagaram</title>
<desc>German-Indological bracket diagram of the eight-member compound śaṅkha-bherī-nāda-hasti-aśva-ghoṣa-pūrṇa-nagaram with TWO dvandva blocks: A = śaṅkha·bherī and C = hasti·aśva (each flat, coordinate), the tatpuruṣa heads B = [A]+nāda and D = [C]+ghoṣa, the two sounds coordinated as E = B·D (a dvandva of tatpuruṣas), then F = [E]+pūrṇa and G = [F]+nagaram — the city filled with the sound of conches-and-kettledrums and the din of elephants-and-horses. II часть begins at pūrṇa (asked). Unsandhied segmented members, full word form.</desc>

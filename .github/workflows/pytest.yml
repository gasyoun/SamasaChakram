name: Python tests

# Runs the committed test suite on every pull request and push to main.
# Beyond the real regression value, this gives Scorecard's CI-Tests check a
# named test check-run on each PR ("Run Python tests"). Dependencies are pinned
# by SHA-256 in requirements-test.txt and installed with --require-hashes, which
# is what Scorecard's Pinned-Dependencies check recognises as a pinned pip command.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Run Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install hash-pinned test dependencies
        run: python -m pip install --require-hashes -r requirements-test.txt

      - name: Run tests
        run: python -m pytest samasacakra/top1000/tests -q

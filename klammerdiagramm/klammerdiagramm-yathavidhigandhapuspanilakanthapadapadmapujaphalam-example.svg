<svg viewBox="0 0 1058 640" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Klammer Serif', 'Charis SIL', Charis, 'Gentium Plus', Georgia, serif">
<title>Klammerdiagramm — yathāvidhigandhapuṣpanīlakaṇṭhapādapadmapūjāphalam</title>
<desc>German-Indological bracket diagram of the ten-member compound yathā-vidhi-gandha-puṣpa-nīla-kaṇṭha-pāda-padma-pūjā-phalam mixing ALL FIVE samāsa kinds: avyayībhāva A = yathā+vidhi, flat dvandva B = gandha·puṣpa, bahuvrīhi C = nīla+kaṇṭha, karmadhāraya D = pāda+padma — four pairs on one rung — then tatpuruṣa binds all right-to-left: E = [C]→[D] (the foot-lotus of the Blue-Throated), F = [E]+pūjā, G = [B]→[F] (worship with incense-and-flowers), H = [A]→[G] (performed according to rule), I = [H]+phalam — the fruit of the whole. Dvandva alone flat; every other kind right-to-left per the MG rulings. II часть begins at nīla (asked). Unsandhied segmented members, full word form.</desc>

name: CodeQL

# Static application security testing (OSSF Scorecard / SAST). The repo's
# executable surface is Python (samasacakra/top1000, scripts/), so a single
# Python CodeQL analysis pass covers it. Actions are pinned by full commit SHA
# and all permissions are read-only at top level, with the one required write
# scoped to the analysis job.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 2 * * 6'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: python

      # Python needs no build step: CodeQL analyses the source directly.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4

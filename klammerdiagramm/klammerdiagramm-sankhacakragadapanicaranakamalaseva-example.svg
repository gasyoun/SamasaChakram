<svg viewBox="0 0 850 500" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Klammer Serif', 'Charis SIL', Charis, 'Gentium Plus', Georgia, serif">
<title>Klammerdiagramm — śaṅkhacakragadāpāṇicaraṇakamalasevā</title>
<desc>German-Indological bracket diagram of the seven-member compound śaṅkha-cakra-gadā-pāṇi-caraṇa-kamala-sevā mixing all three samāsa kinds: flat dvandva A = śaṅkha·cakra·gadā (coordinate, one shared band), mirrored B = [A]+pāṇi — the bahuvrīhi śaṅkhacakragadāpāṇi (exocentric in meaning, right-to-left in structure), standalone karmadhāraya pair C = caraṇa+kamala, directed join D = [B]→[C] (the foot-lotus OF the conch-discus-mace-handed), mirrored E = [D]+sevā — service to the lotus-feet of Viṣṇu. II часть begins at caraṇa (asked). Unsandhied segmented members, full word form.</desc>

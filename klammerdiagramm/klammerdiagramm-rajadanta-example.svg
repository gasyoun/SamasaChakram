<svg viewBox="0 0 322 290" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Klammer Serif', 'Charis SIL', Charis, 'Gentium Plus', Georgia, serif">
<title>Klammerdiagramm — rājadantaḥ (ekadeśin)</title>
<desc>Leitan's ekadeśin / prathamā-tatpuruṣa example rājadantaḥ (dantānāṃ rājā — the front tooth): «перевёрнутое доминирование» — the semantic head is the FIRST member, yet the bracket binds right-to-left like any samāsa; the inverted dominance is a semantics footnote, not a structural mark (MG vote D3). I/II часть omitted (notation demo).</desc>

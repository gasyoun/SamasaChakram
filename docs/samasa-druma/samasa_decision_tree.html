<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samāsa — Decision Tree</title>
<style>
:root{--bg:#f9f7f2;--card:#fff;--border:#d4c9a8;--accent:#2e4057;--accent2:#3e6b8a;
--yes:#2d6a4f;--no:#7b3f20;--shadow:0 2px 12px rgba(0,0,0,.1);--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Georgia',serif;color:#222;min-height:100vh}
header{background:var(--accent);color:#fff;padding:12px 18px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;justify-content:space-between}
header h1{font-size:1rem;font-weight:normal}
.hdr-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang-toggle{display:flex;gap:4px}
.lang-btn{padding:3px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;font-size:.77rem;transition:background .2s}
.lang-btn.active{background:rgba(255,255,255,.25)}
.admin-btn{padding:3px 10px;border-radius:10px;border:1px solid rgba(255,200,100,.5);background:rgba(255,200,100,.15);color:#ffe080;cursor:pointer;font-size:.77rem}
.admin-btn.active{background:rgba(255,200,100,.35)}
.prog-bar{width:100%;background:rgba(255,255,255,.2);height:3px;border-radius:2px;margin-top:6px}
.prog-fill{height:100%;background:#e0c97a;border-radius:2px;transition:width .4s}
.wrap{display:flex;gap:18px;max-width:1000px;margin:0 auto;padding:22px 14px 60px}
.main-col{flex:1;min-width:0}
.sidebar{width:220px;flex-shrink:0}
/* Word input */
.word-input-row{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.word-wrap{position:relative;flex:1;min-width:120px}
.word-input{width:100%;padding:8px 12px 8px 32px;border:1.5px solid var(--border);border-radius:6px;
font-family:'Georgia',serif;font-size:1rem;font-style:italic;background:#fdfaf4;transition:border-color .2s}
.word-input:focus{outline:none;border-color:var(--accent2)}
.word-input::placeholder{font-style:normal;color:#bbb}
.word-check-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:.95rem;pointer-events:none;transition:opacity .25s}
.word-check-on{color:#2d6a4f;opacity:1}
.word-check-off{color:#ccc;opacity:1}
.word-lbl{font-size:.75rem;color:#999;white-space:nowrap}
.clear-word{padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:#f5f0e6;color:#888;cursor:pointer;font-size:.8rem}
/* Card */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1}}
.step-label{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:#999;margin-bottom:7px}
.question{font-size:1.04rem;line-height:1.65;color:#1a1a1a;margin-bottom:6px}
.hint{font-size:.81rem;color:#666;margin-top:7px;background:#f5f0e6;border-left:3px solid var(--border);padding:7px 11px;border-radius:4px;line-height:1.55;margin-bottom:8px}
.freq-row{display:flex;gap:7px;flex-wrap:wrap;margin:5px 0 3px}
.freq-badge{font-size:.68rem;padding:2px 8px;border-radius:11px;font-weight:500}
.fh{background:#d4f0e0;color:#1a6b3a}.fm{background:#fef3cd;color:#7a5a00}.fl{background:#fde8e8;color:#8b2020}
.ref-chips{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0 10px}
.ref-chip{font-size:.67rem;background:#eae4d8;color:#555;padding:2px 7px;border-radius:9px}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px}
.btn{padding:9px 18px;border-radius:6px;border:none;cursor:pointer;font-family:'Georgia',serif;font-size:.91rem;transition:all .18s;flex:1;min-width:90px;text-align:center}
.btn-yes{background:#eaf4ee;color:#2d6a4f;border:1.5px solid #a8d5b8}.btn-yes:hover{background:#c8e8d4}
.btn-no{background:#fdf0e8;color:#7b3f20;border:1.5px solid #e0b898}.btn-no:hover{background:#f5d8c0}
.opts-col{display:flex;flex-direction:column;gap:7px;margin-top:7px}
.btn-opt{padding:10px 14px;border-radius:6px;border:1.5px solid #c0cdd8;background:#f0f4f8;color:var(--accent);cursor:pointer;font-family:'Georgia',serif;font-size:.87rem;text-align:left;transition:all .18s}
.btn-opt:hover{background:#d8e4ee}
.btn-restart{background:var(--accent);color:#fff;border:none;padding:9px 20px;border-radius:6px;cursor:pointer;font-family:'Georgia',serif;font-size:.87rem;margin-top:14px;transition:background .2s}
.btn-restart:hover{background:var(--accent2)}
/* Result */
.result-card{border-radius:var(--r);padding:22px;box-shadow:var(--shadow);animation:fadeIn .35s ease}
.result-type{font-size:1.32rem;font-weight:bold;margin-bottom:2px}
.result-alt{font-size:.78rem;opacity:.75;margin-bottom:9px}
.result-def{font-size:.91rem;line-height:1.65;margin-bottom:9px}
.pat{font-size:.78rem;font-style:italic;background:rgba(0,0,0,.06);padding:3px 9px;border-radius:4px;display:inline-block;margin-bottom:9px}
.form-lbl{font-size:.73rem;opacity:.63;margin-bottom:2px}
.formula{font-size:.91rem;font-style:italic;background:rgba(0,0,0,.05);display:inline-block;padding:3px 9px;border-radius:4px;margin-bottom:10px}
.ex-block{background:rgba(0,0,0,.05);border-radius:6px;padding:10px 12px;margin:9px 0}
.ex-title{font-size:.67rem;letter-spacing:.1em;text-transform:uppercase;opacity:.6;margin-bottom:5px}
.ex-row{display:flex;flex-wrap:wrap;gap:5px;align-items:baseline;margin-bottom:3px;font-size:.86rem}
.ex-iast{font-style:italic;font-size:.95rem}.ex-comp{color:#777;font-size:.76rem}.ex-src{opacity:.43;font-size:.68rem}
.pair-warn{font-size:.77rem;background:rgba(200,100,0,.08);border-radius:5px;padding:7px 10px;margin-top:7px;border-left:3px solid #e08030}
.vigraha-ref{display:block;margin-top:9px;font-size:.73rem;color:var(--accent2);text-decoration:none;border-bottom:1px dotted var(--accent2)}
.theme-tp{background:#eaf2f8;color:#0d3050;border:1.5px solid #a8cce0}
.theme-km{background:#eaf4ea;color:#1a3d1a;border:1.5px solid #a0c8a0}
.theme-bv{background:#f4eaf8;color:#3a1050;border:1.5px solid #c4a0d8}
.theme-dv{background:#fdf5e6;color:#4a2800;border:1.5px solid #ddb870}
.theme-av{background:#eaecf8;color:#1a204a;border:1.5px solid #a0a8d8}
.bc{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:9px}
.bc-item{background:#ede8dc;padding:2px 7px;border-radius:11px;color:#666;font-size:.68rem}
.bc-sep{color:#ccc;align-self:center;font-size:.68rem}
/* Sidebar */
.sidebar-section{margin-bottom:18px}
.sb-title{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#999;margin-bottom:7px}
.hist-item{font-size:.74rem;color:#666;padding:4px 8px;border-left:2px solid #d4c9a8;margin-bottom:3px;line-height:1.38}
.hi-yes{color:#2d6a4f}.hi-no{color:#7b3f20}
/* Word log */
.word-log-item{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-bottom:8px;font-size:.78rem;cursor:pointer;transition:box-shadow .2s}
.word-log-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.wl-word{font-style:italic;font-size:.95rem;color:var(--accent);margin-bottom:3px}
.wl-result{font-size:.74rem;font-weight:500}
.wl-steps{font-size:.69rem;color:#999;margin-top:2px}
.badge-correct{background:#d4f0e0;color:#1a6b3a;padding:1px 7px;border-radius:8px}
.badge-wrong{background:#fde8e8;color:#8b2020;padding:1px 7px;border-radius:8px}
.badge-pending{background:#f0e8d4;color:#7a5a00;padding:1px 7px;border-radius:8px}
/* Admin panel */
.admin-panel{background:#fdfaf4;border:1.5px solid #e0c97a;border-radius:var(--r);padding:18px;margin-bottom:16px;animation:fadeIn .3s}
.admin-title{font-size:.85rem;font-weight:bold;color:#7a5a00;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.admin-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.admin-row label{font-size:.77rem;color:#666;min-width:80px}
.admin-input{padding:5px 9px;border:1px solid var(--border);border-radius:5px;font-family:'Georgia',serif;font-size:.85rem;font-style:italic;min-width:140px}
.admin-select{padding:5px 9px;border:1px solid var(--border);border-radius:5px;font-family:'Georgia',serif;font-size:.82rem;background:#fff}
.admin-verify-btn{padding:5px 12px;border-radius:5px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-size:.8rem}
.admin-log-table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:10px}
.admin-log-table th{background:#2e4057;color:#fff;padding:5px 8px;text-align:left;font-weight:normal;font-size:.72rem}
.admin-log-table td{padding:5px 8px;border-bottom:1px solid #e8e0d0;vertical-align:top}
.admin-log-table tr:nth-child(even) td{background:#faf7f0}
.mark-correct{background:#d4f0e0;color:#1a6b3a;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:.72rem}
.mark-wrong{background:#fde8e8;color:#8b2020;border:none;border-radius:4px;padding:2px 7px;cursor:pointer;font-size:.72rem}
.export-btn{padding:5px 12px;border-radius:5px;border:1px solid var(--border);background:#f5f0e6;color:#555;cursor:pointer;font-size:.78rem;margin-top:8px}
@media(max-width:700px){.wrap{flex-direction:column;padding:12px}.sidebar{width:100%}}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="hdr-title">Samāsa — дерево решений</h1>
    <div style="font-size:.72rem;opacity:.7" id="hdr-sub">Определение типа Sanskrit compound</div>
  </div>
  <div class="hdr-right">
    <div class="lang-toggle">
      <button class="lang-btn" id="btn-ru" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="admin-btn" id="admin-toggle" onclick="toggleAdmin()">⚙ Admin</button>
  </div>
  <div class="prog-bar" style="flex-basis:100%">
    <div class="prog-fill" id="prog" style="width:0%"></div>
  </div>
</header>

<div class="wrap">
  <div class="main-col">
    <div id="admin-area" style="display:none"></div>
    <div id="word-input-area"></div>
    <div id="main-area"></div>
  </div>
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sb-title" id="hist-lbl">Шаги</div>
      <div id="step-history"></div>
    </div>
    <div class="sidebar-section">
      <div class="sb-title" id="log-lbl">Слова сессии</div>
      <div id="word-log"></div>
    </div>
  </div>
</div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
var lang = 'ru';
var stepHistory = [];   // steps in current analysis
var current = 'start';
var currentWord = '';   // word currently being analyzed
var wordLog = [];       // [{word, result, steps, verdict}]  verdict: 'correct'|'wrong'|null
var adminMode = false;
var adminRefWord = '';
var adminRefResult = '';

// ── LANGUAGE ──────────────────────────────────────────────────────────────────
function setLang(l) {
  lang = l;
  try { var u=new URL(location.href); u.searchParams.set('lang',l); history.replaceState(null,'',u); } catch(e) {}
  document.getElementById('btn-ru').classList.toggle('active', l==='ru');
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.getElementById('hdr-title').textContent = l==='ru' ? 'Samāsa — дерево решений' : 'Samāsa — decision tree';
  document.getElementById('hdr-sub').textContent  = l==='ru' ? 'Определение типа Sanskrit compound' : 'Identify the type of a Sanskrit compound';
  document.getElementById('hist-lbl').textContent = l==='ru' ? 'Шаги' : 'Steps';
  document.getElementById('log-lbl').textContent  = l==='ru' ? 'Слова сессии' : 'Session log';
  document.getElementById('admin-toggle').textContent = (l==='ru' ? '⚙ Адм.' : '⚙ Admin');
  renderWordInput();
  render();
  renderWordLog();
  if (adminMode) renderAdmin();
}
(function(){
  try { var p=new URLSearchParams(location.search).get('lang'); if(p==='en') lang='en'; } catch(e) {}
})();

function L(ru, en) { return lang === 'en' ? (en || ru) : ru; }

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function toggleAdmin() {
  adminMode = !adminMode;
  document.getElementById('admin-toggle').classList.toggle('active', adminMode);
  if (adminMode) renderAdmin(); else document.getElementById('admin-area').style.display='none';
}

function renderAdmin() {
  var el = document.getElementById('admin-area');
  el.style.display = 'block';
  var total = wordLog.length;
  var correct = wordLog.filter(function(w){ return w.verdict === 'correct'; }).length;
  var wrong   = wordLog.filter(function(w){ return w.verdict === 'wrong'; }).length;
  var pending = total - correct - wrong;

  var rows = wordLog.map(function(w, i) {
    var stepsStr = w.steps.map(function(s){ return s.label; }).join(' › ');
    var verdictBtn = '';
    if (w.verdict === 'correct') {
      verdictBtn = '<span class="badge-correct">✓ ' + (lang==='ru'?'верно':'correct') + '</span>'
                + ' <button class="mark-wrong" onclick="setVerdict('+i+',\'wrong\')">' + (lang==='ru'?'✗ ошибка':'✗ wrong') + '</button>';
    } else if (w.verdict === 'wrong') {
      verdictBtn = '<span class="badge-wrong">✗ ' + (lang==='ru'?'ошибка':'wrong') + '</span>'
                + ' <button class="mark-correct" onclick="setVerdict('+i+',\'correct\')">' + (lang==='ru'?'✓ верно':'✓ correct') + '</button>';
    } else {
      verdictBtn = '<button class="mark-correct" onclick="setVerdict('+i+',\'correct\')">' + (lang==='ru'?'✓ верно':'✓ correct') + '</button>'
                + ' <button class="mark-wrong" onclick="setVerdict('+i+',\'wrong\')">' + (lang==='ru'?'✗ ошибка':'✗ wrong') + '</button>';
    }
    var ref = w.refResult ? ('<br><span style="font-size:.7rem;color:#888">' + (lang==='ru'?'Эталон: ':'Ref: ') + w.refResult + '</span>') : '';
    return '<tr><td style="font-style:italic;color:var(--accent)">'
         + (w.word || '—')
         + '<br><span style="font-size:.65rem;color:#bbb">#' + w.id.substr(0,8)
         + ' · ' + new Date(w.timestamp).toLocaleString() + '</span></td>'
         + '<td>' + w.result + ref + '</td>'
         + '<td style="color:#888;font-size:.72rem">' + stepsStr + '</td>'
         + '<td>' + verdictBtn + '</td></tr>';
  }).join('');

  var refOptions = Object.keys(RESULTS).map(function(k){
    return '<option value="' + k + '">' + RESULTS[k].type() + '</option>';
  }).join('');

  el.innerHTML = '<div class="admin-panel">'
    + '<div class="admin-title">⚙ ' + (lang==='ru'?'Панель преподавателя':'Admin / Teacher Panel')
    + ' &nbsp;<span style="font-size:.75rem;font-weight:normal;color:#888">'
    + total + ' ' + (lang==='ru'?'слов':'words') + ' · '
    + correct + ' ✓ · ' + wrong + ' ✗ · ' + pending + ' ' + (lang==='ru'?'не проверено':'unchecked')
    + '</span></div>'
    + '<div class="admin-row"><label>' + (lang==='ru'?'Слово:':'Word:') + '</label>'
    + '<input class="admin-input" id="adm-word" placeholder="' + (lang==='ru'?'самаса для проверки':'compound to verify') + '" value="' + adminRefWord + '" oninput="adminRefWord=this.value">'
    + '<label style="margin-left:8px">' + (lang==='ru'?'Эталон:':'Reference:') + '</label>'
    + '<select class="admin-select" id="adm-ref" onchange="adminRefResult=this.value"><option value="">' + (lang==='ru'?'— выбрать —':'— select —') + '</option>' + refOptions + '</select>'
    + '<button class="admin-verify-btn" onclick="applyRef()">' + (lang==='ru'?'Применить':'Apply') + '</button></div>'
    + (rows ? '<table class="admin-log-table"><thead><tr>'
      + '<th>' + (lang==='ru'?'Слово':'Word') + '</th>'
      + '<th>' + (lang==='ru'?'Результат':'Result') + '</th>'
      + '<th>' + (lang==='ru'?'Шаги':'Steps') + '</th>'
      + '<th>' + (lang==='ru'?'Оценка':'Verdict') + '</th>'
      + '</tr></thead><tbody>' + rows + '</tbody></table>' : '<div style="color:#999;font-size:.82rem;padding:8px 0">' + (lang==='ru'?'Журнал пуст. Начните анализировать слова.':'Log empty. Start analyzing words.') + '</div>')
    + '<br><button class="export-btn" onclick="exportLog()">' + (lang==='ru'?'⬇ Экспорт JSON':'⬇ Export JSON') + '</button>'
    + '</div>';
}

function setVerdict(i, verdict) {
  wordLog[i].verdict = verdict;
  renderAdmin();
  renderWordLog();
}

function applyRef() {
  var word = document.getElementById('adm-word').value.trim();
  var ref  = document.getElementById('adm-ref').value;
  if (!word || !ref) return;
  // Find matching word in log and set refResult + auto-verdict
  var found = false;
  wordLog.forEach(function(w) {
    if (w.word === word) {
      w.refResult = RESULTS[ref] ? RESULTS[ref].type() : ref;
      // auto-verdict: correct if result key matches
      w.verdict = (w.resultKey === ref) ? 'correct' : 'wrong';
      found = true;
    }
  });
  if (!found) { alert(lang==='ru'?'Слово не найдено в журнале':'Word not found in log'); return; }
  adminRefWord = ''; adminRefResult = '';
  renderAdmin(); renderWordLog();
}

function exportLog() {
  var data = JSON.stringify(wordLog, null, 2);
  var blob = new Blob([data], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'samasa_log.json'; a.click();
  URL.revokeObjectURL(url);
}

// ── WORD INPUT ────────────────────────────────────────────────────────────────
function renderWordInput() {
  var iconCls = currentWord ? 'word-check-on' : 'word-check-off';
  document.getElementById('word-input-area').innerHTML =
    '<div class="word-input-row">'
    + '<span class="word-lbl">' + (lang==='ru'?'Слово для анализа:':'Word to analyze:') + '</span>'
    + '<div class="word-wrap">'
    + '<span class="word-check-icon ' + iconCls + '">✓</span>'
    + '<input class="word-input" id="word-field" type="text" '
    + 'placeholder="' + (lang==='ru'?'rājaputraḥ …':'rājaputraḥ …') + '" '
    + 'value="' + currentWord + '" '
    + 'oninput="onWordInput(this.value)">'
    + '</div>'
    + (currentWord ? '<button class="clear-word" onclick="clearWord()">✕</button>' : '')
    + '</div>';
}

function onWordInput(val) {
  var newWord = val.trim();
  currentWord = newWord;
  // Toggle checkmark class in-place without full re-render
  var icon = document.querySelector('.word-check-icon');
  if (icon) {
    icon.className = 'word-check-icon ' + (newWord ? 'word-check-on' : 'word-check-off');
  }
  // Show/hide clear button in-place
  var clr = document.querySelector('.clear-word');
  if (newWord && !clr) {
    var wrap = document.querySelector('.word-wrap');
    if (wrap) {
      var btn = document.createElement('button');
      btn.className = 'clear-word'; btn.onclick = clearWord; btn.textContent = '✕';
      wrap.parentNode.insertBefore(btn, wrap.nextSibling);
    }
  } else if (!newWord && clr) { clr.remove(); }
  // If we're on a result screen and user typed a NEW word → auto-restart
  if (isResultState && newWord && newWord !== lastAnalyzedWord) {
    showAutoRestartNotice();
  }
}

function showAutoRestartNotice() {
  var notice = document.getElementById('auto-restart-notice');
  if (!notice) {
    notice = document.createElement('div');
    notice.id = 'auto-restart-notice';
    notice.style.cssText = 'font-size:.78rem;background:#f5f0e6;border-left:3px solid #e0c97a;padding:6px 10px;border-radius:4px;margin-bottom:8px;display:flex;align-items:center;gap:10px';
    document.getElementById('word-input-area').appendChild(notice);
  }
  notice.innerHTML = '↺ ' + (lang==='ru'?'Введено новое слово — перезапуск анализа...':'New word detected — restarting...');
  setTimeout(function() {
    restart();
  }, 900);
}


function clearWord() {
  currentWord = '';
  renderWordInput();
}

// ── CORE ──────────────────────────────────────────────────────────────────────
function bcHtml() {
  if (!stepHistory.length) return '';
  return '<div class="bc">' + stepHistory.map(function(h){
    return '<span class="bc-item">' + h.label + '</span>';
  }).join('<span class="bc-sep">›</span>') + '</div>';
}

function renderStepHistory() {
  document.getElementById('step-history').innerHTML = stepHistory.map(function(h){
    return '<div class="hist-item"><span>' + h.qShort + '</span><br>'
      + '<span class="' + (h.yes?'hi-yes':'hi-no') + '">' + h.label + '</span></div>';
  }).join('');
}

function renderWordLog() {
  function sBtn(ord, lbl) {
    var active = sortOrder === ord;
    return '<button style="font-size:.68rem;padding:2px 7px;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:'
      +(active?'var(--accent)':'#f5f0e6')+';color:'+(active?'#fff':'#555')
      +'" onclick="setSortOrder(\'' + ord + '\')">' + lbl + '</button>';
  }
  var sortBtns = '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">'
    +'<span style="font-size:.68rem;color:#999;align-self:center">' + L('Сортировка:','Sort:') + '</span>'
    + sBtn('desc', L('Новые','Newest'))
    + sBtn('asc',  L('Старые','Oldest'))
    + sBtn('alpha','A–Z')
    +'</div>';

  var sorted = wordLog.slice();
  if (sortOrder === 'desc')  sorted.sort(function(a,b){return b.timestamp - a.timestamp;});
  else if (sortOrder === 'asc') sorted.sort(function(a,b){return a.timestamp - b.timestamp;});
  else sorted.sort(function(a,b){return (a.word||'').localeCompare(b.word||'');});

  var items = sorted.map(function(w) {
    var vcls = w.verdict === 'correct' ? 'badge-correct' : w.verdict === 'wrong' ? 'badge-wrong' : 'badge-pending';
    var vlbl = w.verdict === 'correct' ? '✓' : w.verdict === 'wrong' ? '✗' : '?';
    var origIdx = wordLog.indexOf(w);
    var dt = new Date(w.timestamp);
    var timeStr = dt.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    var dateStr = dt.toLocaleDateString([], {day:'2-digit', month:'2-digit'});
    return '<div class="word-log-item" onclick="reviewWord('+origIdx+')">'
      +'<div class="wl-word">' + (w.word || '('+L('без слова','no word')+')') + ' <span class="'+vcls+'">'+vlbl+'</span>'
      +'<span style="font-size:.65rem;color:#aaa;float:right">#'+w.id.substr(0,6)+'</span></div>'
      +'<div class="wl-result" style="font-size:.76rem">'+w.result+'</div>'
      +'<div class="wl-steps" style="display:flex;justify-content:space-between">'
      +'<span>'+w.steps.length+' '+(lang==='ru'?'шагов':'steps')+'</span>'
      +'<span style="font-size:.65rem;color:#bbb">'+dateStr+' '+timeStr+'</span>'
      +'</div>'
      +'</div>';
  }).join('');

  document.getElementById('word-log').innerHTML = sortBtns
    + (items || '<div style="font-size:.75rem;color:#bbb">' + L('Пока пусто','Empty so far') + '</div>');
}

function setSortOrder(order) {
  sortOrder = order;
  renderWordLog();
}


function reviewWord(i) {
  var w = wordLog[i];
  var el = document.getElementById('main-area');
  var dt = new Date(w.timestamp);
  var dtStr = dt.toLocaleString([], {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  el.innerHTML = '<div class="card">'
    + '<div style="text-align:right;font-size:.65rem;color:#aaa;margin-bottom:4px">#' + w.id + ' · ' + dtStr + '</div>'
    + '<div class="step-label">' + (lang==='ru'?'Просмотр записи':'Review entry') + '</div>'
    + '<div class="question" style="font-style:italic">' + (w.word || '(' + (lang==='ru'?'без слова':'no word') + ')') + '</div>'
    + '<div style="font-size:.9rem;margin:8px 0">' + (lang==='ru'?'Результат:':'Result:') + ' <strong>' + w.result + '</strong></div>'
    + (w.refResult ? '<div style="font-size:.82rem;color:#888">' + (lang==='ru'?'Эталон:':'Reference:') + ' ' + w.refResult
      + ' <span class="' + (w.verdict==='correct'?'badge-correct':'badge-wrong') + '">' + (w.verdict==='correct'?'✓':'✗') + '</span></div>' : '')
    + '<div style="font-size:.78rem;color:#888;margin-top:10px">' + (lang==='ru'?'Шаги:':'Steps:') + '</div>'
    + '<div style="font-size:.78rem;color:#666;margin-top:4px">' + w.steps.map(function(s,j){
        return (j+1) + '. <em>' + s.qShort + '</em> → <span class="' + (s.yes?'hi-yes':'hi-no') + '">' + s.label + '</span>';
      }).join('<br>') + '</div>'
    + '<button class="btn-restart" onclick="restart()">' + (lang==='ru'?'↺ Новое слово':'↺ New word') + '</button></div>';
}

// ── FORMAL STATUS CHECK ───────────────────────────────────────────────────────
// Returns {status:'ok'|'impossible'|'unlikely', reason: string}
function getFormalStatus(optionKey, word) {
  if (!word || word.length < 2) return {status:'ok'};
  var w = word.trim().toLowerCase();

  if (optionKey === 'r_tp_nan') {
    // nañ requires word to start with a- or an-
    if (!/^an?[bcdfghjklmnpqrstvwyzāīūṛśṣṭḍṇñṅḥṃ]/.test(w) && !/^a[^aāiīuūṛe]/.test(w)) {
      return {status:'impossible',
        reason: L('Слово не начинается с a-/an- → nañ формально невозможен',
                  'Word does not start with a-/an- → nañ formally excluded')};
    }
  }
  if (optionKey === 'r_avyayibhava') {
    if (!w.match(/am$|m$/)) {
      return {status:'unlikely',
        reason: L('Авьяибхава — всегда acc.sg.nt. (-am); это слово может не подходить',
                  'Avyayībhāva is always acc.sg.nt. (-am); this word may not qualify')};
    }
  }
  if (optionKey === 'r_dv_samahara') {
    if (!w.match(/am$|m$/)) {
      return {status:'unlikely',
        reason: L('Samāhāra-dvandva — sg.nt. (-am); форма не совпадает',
                  'Samāhāra-dvandva is sg.nt. (-am); form does not match')};
    }
  }
  if (optionKey === 'r_dv_itaretara') {
    if (w.match(/am$|aḥ$/) && !w.match(/au$/)) {
      return {status:'unlikely',
        reason: L('Itaretara-dvandva — обычно du. (-au) или pl. (-āḥ)',
                  'Itaretara-dvandva is usually du. (-au) or pl. (-āḥ)')};
    }
  }
  return {status:'ok'};
}

// ── WORD ANALYSIS HINTS ───────────────────────────────────────────────────────
// Returns array of hint strings about the word's morphological signals
function getWordHints(word) {
  if (!word || word.length < 2) return [];
  var w = word.trim().toLowerCase();
  var hints = [];

  // Prefix analysis
  var preverbs = [
    ['pra','pra- (prefix: forth, away, very) → likely prādi-tatpuruṣa or avyayībhāva'],
    ['upa','upa- (prefix: near, toward) → likely avyayībhāva'],
    ['nir','nir- (prefix: out, without) → likely avyayībhāva'],
    ['sam','sam- (prefix: together, fully) → likely prādi/gati-tatpuruṣa'],
    ['ati','ati- (prefix: over, very) → avyayībhāva OR prādi-tatpuruṣa'],
    ['adhi','adhi- (prefix: above, over) → likely avyayībhāva'],
    ['anu','anu- (prefix: along, after) → likely avyayībhāva'],
    ['abhi','abhi- (prefix: toward, against) → avyayībhāva or prādi'],
    ['pari','pari- (prefix: around, fully) → avyayībhāva or prādi'],
    ['vi','vi- (prefix: apart, without) → prādi-tatpuruṣa'],
    ['su','su- (prefix: good, well) → karmadhāraya or avyayībhāva'],
    ['dur','dur-/duḥ- (prefix: bad, hard) → karmadhāraya'],
    ['niḥ','niḥ-/nis- (prefix: without) → avyayībhāva or nañ-like'],
  ];
  var nañ = /^an?[^aāiīuūṛ]/.test(w) || /^a[bcdfghjklmnpqrstvwyzśṣṭḍṇñṅ]/.test(w);
  if (nañ) hints.push(L('Начинается с a-/an- → возможен nañ-tatpuruṣa или nañ-bahuvrīhi',
                         'Starts with a-/an- → possible nañ-tatpuruṣa or nañ-bahuvrīhi'));
  else {
    for (var i=0; i<preverbs.length; i++) {
      if (w.startsWith(preverbs[i][0])) { hints.push(preverbs[i][1]); break; }
    }
  }

  // Ending analysis
  var endings = [
    [/am$/,  L('Оканч. -am → acc.sg.nt. или adverb → возможна avyayībhāva',
               'Ends -am → acc.sg.nt. / adverb → possible avyayībhāva')],
    [/aḥ$/,  L('Оканч. -aḥ → nom.sg.m. → не avyayībhāva',
               'Ends -aḥ → nom.sg.m. → not avyayībhāva')],
    [/au$/,  L('Оканч. -au → nom./acc. du. → возможна itaretara-dvandva',
               'Ends -au → nom./acc. du. → possible itaretara-dvandva')],
    [/āḥ$/,  L('Оканч. -āḥ → nom.pl.m. или nom.sg.f. → возможна dvandva (pl.)',
               'Ends -āḥ → nom.pl.m. or nom.sg.f. → possible dvandva (pl.)')],
    [/iḥ$/,  L('Оканч. -iḥ → nom.sg.m. (i-основа) → скорее всего существительное',
               'Ends -iḥ → nom.sg.m. (i-stem) → likely noun')],
  ];
  for (var j=0; j<endings.length; j++) {
    if (endings[j][0].test(w)) { hints.push(endings[j][1]); break; }
  }

  return hints;
}

// Lookup word in canonical DB (try exact + strip endings)
function iastNormalize(s) {
  // Normalize IAST: map diacritics to base letters, remove ḥ (visarga)
  return s.toLowerCase()
    .replace(/ṛ/g,'r').replace(/ḥ/g,'').replace(/ṃ/g,'m')
    .replace(/ś/g,'s').replace(/ṣ/g,'s').replace(/ñ/g,'n').replace(/ṅ/g,'n').replace(/ṇ/g,'n')
    .replace(/ṭ/g,'t').replace(/ḍ/g,'d')
    .replace(/ā/g,'a').replace(/ī/g,'i').replace(/ū/g,'u')
    .replace(/[^a-z]/g,'');
}

function lookupCanonical(word) {
  if (!word) return null;
  var w = word.trim().toLowerCase();

  // 1. Exact match
  if (CANONICAL_DB[w]) return CANONICAL_DB[w];

  // 2. Strip common case endings and retry exact
  var endings = [
    /[ḥṃ]$/, /am$/, /au$/, /āḥ$/, /iḥ$/, /uḥ$/, /āḥ$/, /ā$/, /aḥ$/, /iṃ$/, /im$/
  ];
  for (var i = 0; i < endings.length; i++) {
    var stem = w.replace(endings[i], '');
    if (stem && CANONICAL_DB[stem]) return CANONICAL_DB[stem];
    if (stem && CANONICAL_DB[stem+'ḥ']) return CANONICAL_DB[stem+'ḥ'];
    if (stem && CANONICAL_DB[stem+'aḥ']) return CANONICAL_DB[stem+'aḥ'];
  }

  // 3. Normalized fuzzy match (ignores diacritics)
  var wNorm = iastNormalize(w);
  if (wNorm.length < 3) return null;
  var keys = Object.keys(CANONICAL_DB);
  for (var k = 0; k < keys.length; k++) {
    if (iastNormalize(keys[k]) === wNorm) return CANONICAL_DB[keys[k]];
  }
  // 4. Fuzzy with endings stripped
  var wStem = w.replace(/[aeiouāīū]ḥ$|ḥ$|m$|ṃ$/,'');
  var wStemNorm = iastNormalize(wStem);
  if (wStemNorm.length >= 3) {
    for (var k = 0; k < keys.length; k++) {
      var kStemNorm = iastNormalize(keys[k].replace(/[aeiouāīū]ḥ$|ḥ$|m$|ṃ$/,''));
      if (kStemNorm === wStemNorm) return CANONICAL_DB[keys[k]];
    }
  }
  // 5. Consonant-skeleton match (handles vowel diacritic variants: kraṣṇa / kṛṣṇa)
  function consOnly(s) { return iastNormalize(s).replace(/[aeiou]/g,''); }
  var wCons = consOnly(w);
  if (wCons.length >= 3) {
    for (var k = 0; k < keys.length; k++) {
      if (consOnly(keys[k]) === wCons) return CANONICAL_DB[keys[k]];
    }
  }
  return null;
}

  if (!r) return base;

    return base + ' <span style="font-size:.67rem;color:#2d6a4f;font-style:normal;margin-left:4px">('
      + L('последний','final') + ')</span>';

  if (r.min === r.max) {
    return base + ' <span style="font-size:.67rem;color:#888;font-style:normal;margin-left:4px">('
      + r.min + ' ' + L('шага','steps') + ')</span>';
  }
  // Show range only when it narrows to ≤3 options remaining
  if (r.max <= 3) {
    return base + ' <span style="font-size:.67rem;color:#888;font-style:normal;margin-left:4px">('
      + L('осталось','left') + ' ' + r.min + (r.min !== r.max ? '–' + r.max : '') + ')</span>';

  return base;
}

// ── RENDER ENGINE ─────────────────────────────────────────────────────────────
function freqHtml(arr) {
  if (!arr) return '';
  return '<div class="freq-row">' + arr.map(function(x){
    return '<span class="freq-badge '+x[1]+'">'+x[0]+'</span>';
  }).join('') + '</div>';
}
function refHtml(node) {
  var refs = node.refs ? (node.refs[lang] || node.refs.ru) : [];
  if (!refs.length) return '';
  return '<div class="ref-chips">' + refs.map(function(s){
    return '<span class="ref-chip">'+s+'</span>';
  }).join('') + '</div>';
}
function bcHtml() {
  if (!stepHistory.length) return '';
  return '<div class="bc">' + stepHistory.map(function(h){
    return '<span class="bc-item">'+h.label+'</span>';
  }).join('<span class="bc-sep">›</span>') + '</div>';
}
function updateSideHistory() {
  document.getElementById('step-history').innerHTML = stepHistory.map(function(h){
    return '<div class="hist-item"><span>'+h.qShort+'</span><br>'
      +'<span class="'+(h.yes?'hi-yes':'hi-no')+'">'+h.label+'</span></div>';
  }).join('');
}



// ── AVYAYA WORD LIST ──────────────────────────────────────────────────────────
// Lookup set of known avyaya words (uninflected indeclinables).
// Stored as stems (without ḥ/m endings). User can extend by editing AVYAYA_WORDS.
// Current count: ~120 core avyaya. Structure ready for 3000+ entries.
var AVYAYA_WORDS = (function() {
  var words = [
    // Conjunctions and particles
    'ca','vā','iti','api','tu','eva','hi','ha','tathā','atha','atho','nu',
    'khalu','nanu','nūnam','kila','iva','yathā','tathāhi','yathāpi','tadvat',
    'yadā','tadā','kadā','sarvadā','sadā','ekadā','kadācit','kadācana',
    'nitya','nityam','satata','satatam','muhur','muhurmuhuḥ',
    // Spatial avyaya
    'atra','tatra','kutra','kva','amutra','anyatra','sarvatra',
    'iha','ihā','tatas','kutoḥ','ataḥ','etaḥ',
    // Preverbs used as avyaya in avyayībhāva
    'upa','adhi','anu','abhi','apa','ati','yathā','yatha',
    'prati','pari','parā','para','sam','pra','vi','ud','ut','ni',
    'nir','niḥ','nis','dur','duḥ','su','ā',
    // Common indeclinable adverbs
    'saha','vinā','ṛte','prāk','paścāt','purā','tadā','idānīm',
    'adya','śvaḥ','hyaḥ','samprati','etarhi','itthaṃ','tathaiva','nahi',
    // Negatives
    'na','mā','no','nahi','natu',
    // Directional/spatial
    'uttarataḥ','dakṣiṇataḥ','pūrvataḥ','paścimataḥ','upariṣṭāt','adhastāt',
    'abhitaḥ','paritaḥ','samantataḥ','antataḥ','agre','paścāt','puraḥ',
    // Degree/manner
    'alam','bāḍham','bāḍha','kṣipram','śīghram','tūrṇam','bhṛśam',
    'atīva','ativela','atimātra','atyartham','bahutaram','kiñcit',
    // Indeclinables from Sanskrit grammar tradition (nipāta)
    'khalv','kha','ha','he','bhoḥ','are','ambho','re','hanta','diṣṭyā',
    'svasti','svāhā','vaṣaṭ','namaḥ','svadha','śraddhā',
    // Common in compounds (avyayībhāva first members)
    'antar','antas','bahis','tiryak','udak','adas','itara','para',
    'apara','ubhaya','sarva','viśva','ubh',
    // Indeclinable participles (ktvā, ya forms)
    'ārabhya','upādāya','śrutvā','dṛṣṭvā','gatvā','āgamya','prapya',
    'labdhvā','kṛtvā','uktva','jñātvā','dattvā','hatvā',
  ];
  var set = {};
  for (var i = 0; i < words.length; i++) {
    set[words[i]] = true;
    // Also store without final vowel (for sandhi variants)
    var w = words[i].replace(/[aāiīuū]$/, '');
    if (w.length > 1) set[w] = true;
  }
  return set;
})();

// Check if a word stem is a known avyaya (indeclinable)
function isKnownAvyaya(word) {
  if (!word) return false;
  var w = word.trim().toLowerCase();
  // Direct lookup
  if (AVYAYA_WORDS[w]) return true;
  // Strip case endings and retry
  var stems = [
    w.replace(/[ḥṃ]$/, ''), w.replace(/am$/, ''), w.replace(/ā$/, ''),
    w.replace(/āt$/, ''), w.replace(/e$/, ''), w.replace(/āṃ$/, '')
  ];
  for (var i = 0; i < stems.length; i++) {
    if (stems[i].length > 1 && AVYAYA_WORDS[stems[i]]) return true;
  }
  return false;
}

// ── PREFIX AUTO-DETECTION ─────────────────────────────────────────────────────
// Returns {prefix, type, certainty} or null
// Handles sandhi: e.g. "ny" from "ni+a", "ūp" from "upa+", etc.
var PREVERB_LIST = [
  // avyayībhāva-strong (listed most→least specific to avoid false matches)
  {pre:'adhi',  type:'avyaya', label:'adhi-', note:null},
  {pre:'antar', type:'avyaya', label:'antar-', note:null},
  {pre:'anuṣ',  type:'avyaya', label:'anuṣ-', note:null},
  {pre:'anu',   type:'avyaya', label:'anu-', note:null},
  {pre:'apari', type:'avyaya', label:'apari-', note:null},
  {pre:'abhi',  type:'avyaya', label:'abhi-', note:null},
  {pre:'apa',   type:'avyaya', label:'apa-', note:null},
  {pre:'ati',   type:'avyaya', label:'ati-', note:null},
  {pre:'yathā', type:'avyaya', label:'yathā-', note:null},
  {pre:'yatha', type:'avyaya', label:'yathā-', note:null},
  {pre:'prati', type:'avyaya', label:'prati-', note:null},
  {pre:'pary',  type:'avyaya', label:'pari-', note:'sandhi: pari+a→parya'},
  {pre:'pari',  type:'avyaya', label:'pari-', note:null},
  {pre:'parā',  type:'avyaya', label:'parā-', note:null},
  {pre:'para',  type:'avyaya', label:'parā-', note:null},
  {pre:'upary', type:'avyaya', label:'upari-', note:null},
  {pre:'upāṅg', type:'avyaya', label:'upa-', note:'sandhi'},
  {pre:'upa',   type:'avyaya', label:'upa-', note:null},
  {pre:'āṅg',   type:'avyaya', label:'ā-', note:'sandhi: ā+g'},
  {pre:'āc',    type:'avyaya', label:'ā-', note:'sandhi'},
  // ā- is tricky: very short, only flag if 2+ chars follow
  {pre:'niṣ',  type:'avyaya', label:'nis-/nir-', note:'sandhi niḥ+k/p/t→niṣ'},
  {pre:'nir',  type:'avyaya', label:'nir-', note:null},
  {pre:'niḥ',  type:'avyaya', label:'niḥ-', note:null},
  {pre:'nir',  type:'avyaya', label:'nir-', note:null},
  {pre:'ni',   type:'avyaya', label:'ni-', note:null},
  {pre:'sam',  type:'avyaya', label:'sam-/saṃ-', note:null},
  {pre:'saṃ',  type:'avyaya', label:'saṃ-', note:null},
  {pre:'pra',  type:'avyaya', label:'pra-', note:null},
  {pre:'vi',   type:'avyaya', label:'vi-', note:null},
  {pre:'ut',   type:'avyaya', label:'ut-/ud-', note:null},
  {pre:'ud',   type:'avyaya', label:'ud-', note:null},
  // su- / duḥ- / dur-: karmadhāraya OR avyayībhāva
  {pre:'suṣ',  type:'su_dur', label:'su-', note:'sandhi'},
  {pre:'sūṣ',  type:'su_dur', label:'su-', note:'sandhi'},
  {pre:'svā',  type:'su_dur', label:'su-', note:'sandhi su+ā→svā'},
  {pre:'sva',  type:'su_dur', label:'su-', note:'sandhi su+a→sva'},
  {pre:'sū',   type:'su_dur', label:'su-', note:'sandhi su+u→sū'},
  {pre:'so',   type:'su_dur', label:'su-', note:'sandhi su+o'},
  {pre:'su',   type:'su_dur', label:'su-', note:null},
  {pre:'duṣ',  type:'su_dur', label:'dur-/duṣ-', note:'sandhi'},
  {pre:'dur',  type:'su_dur', label:'dur-', note:null},
  {pre:'duḥ',  type:'su_dur', label:'duḥ-', note:null},
  // nañ (a-/an-): separate category
  {pre:'an',   type:'nan',  label:'an-', note:'nañ before vowel'},
];

function detectPrefix(word) {
  if (!word || word.length < 3) return null;
  var w = word.trim().toLowerCase();
  for (var i = 0; i < PREVERB_LIST.length; i++) {
    var p = PREVERB_LIST[i];
    if (w.startsWith(p.pre) && w.length > p.pre.length + 1) {
      return p;
    }
  }
  // nañ: a- before consonant (not before vowel — those are sandhi of other prefixes)
  if (/^a[^aāiīuūṛeēo]/.test(w) && w.length > 2) {
    return {pre:'a', type:'nan', label:'a-', note:L('nañ перед согласной','nañ before consonant')};
  }
  return null;
}

// Given current node and detected prefix, should we auto-suggest an answer?
function getAutoSuggestion(nodeId, word) {
  if (!word) return null;
  var p = detectPrefix(word);
  if (!p) return null;

  if (nodeId === 'start') {
    // Check avyaya wordlist first (definitive)
    if (isKnownAvyaya(word)) {
      // But if it also has a preverb → it's really being used as a compound prefix
      var isPreverb = p && (p.type === 'avyaya' || p.type === 'su_dur');
      return {
        suggest: 'yes',
        certainty: 'definite',
        msg: L(
          (isPreverb
            ? 'Слово начинается с <strong>' + p.label + '</strong> и является avyaya. '
            : 'Слово <strong>«⁠' + word + '⁠»</strong> присутствует в списке avyaya. ')
          + '<strong>Первый компонент — неизменяемое слово.</strong> Ответ: <strong>Да</strong>.',
          (isPreverb
            ? 'Word starts with <strong>' + p.label + '</strong> and is an avyaya. '
            : 'Word <strong>«⁠' + word + '⁠»</strong> is in the avyaya list. ')
          + '<strong>First member is an indeclinable.</strong> Answer: <strong>Yes</strong>.'
        )
      };
    }
    if (p) {
      if (p.type === 'avyaya') {
        return {
          suggest: 'yes',
          certainty: 'likely',
          msg: L(
            'Слово начинается с <strong>' + p.label + '</strong>'
            + (p.note ? ' (' + p.note + ')' : '')
            + ' — это avyaya-преверб. Вероятный ответ: <strong>Да</strong>.',
            'Word starts with <strong>' + p.label + '</strong>'
            + (p.note ? ' (' + p.note + ')' : '')
            + ' — an avyaya preverb. Likely answer: <strong>Yes</strong>.'
          )
        };
      }
      if (p.type === 'su_dur') {
        return {
          suggest: 'ambiguous',
          certainty: 'check',
          msg: L(
            'Слово начинается с <strong>' + p.label + '</strong>'
            + ' — может быть karmadhāraya ИЛИ avyayībhāva. Проверьте: итог = наречие?',
            'Word starts with <strong>' + p.label + '</strong>'
            + ' — could be karmadhāraya OR avyayībhāva. Check: is the result an adverb?'
          )
        };
      }
      if (p.type === 'nan') {
        return {
          suggest: 'no',
          certainty: 'definite',
          msg: L(
            'Слово начинается с <strong>' + p.label + '</strong> (nañ — отрицание). '
            + 'Это НЕ avyayībhāva. Ответ: <strong>Нет</strong> → tatpuruṣa или bahuvrīhi.',
            'Word starts with <strong>' + p.label + '</strong> (nañ — negation). '
            + 'NOT avyayībhāva. Answer: <strong>No</strong> → tatpuruṣa or bahuvrīhi.'
          )
        };
      }
    }
    // No prefix detected and not in avyaya list: definitive No
    if (word && word.length > 2) {
      return {
        suggest: 'no',
        certainty: 'likely',
        msg: L(
          'Слово <strong>«⁠' + word + '⁠»</strong> не начинается с известного авьяя-префикса и не найдено в списке avyaya. Вероятный ответ: <strong>Нет</strong>.',
          'Word <strong>«⁠' + word + '⁠»</strong> does not start with a known avyaya prefix and is not in the avyaya list. Likely answer: <strong>No</strong>.'
        )
      };
    }
  }
  return null;
}

function render() {
  isResultState = false;
  updateSideHistory();
  var node = NODES[current];
  if (!node) { renderResult(current); return; }
  var pct = node.total ? Math.round((node.step-1)/node.total*100) : 0;
  document.getElementById('prog').style.width = pct+'%';

  // Word analysis hints
  var wordHints = getWordHints(currentWord);
  var hintHtml = wordHints.length
    ? '<div style="margin:6px 0 8px;padding:6px 10px;background:#eaf2f8;border-left:3px solid #a8cce0;border-radius:4px;font-size:.76rem;color:#2e4057">'
      + '<strong>' + L('Анализ слова','Word analysis') + (currentWord ? ' «⁠' + currentWord + '⁠»' : '') + ':</strong> '
      + wordHints.join(' · ') + '</div>'
    : '';

  // Auto-suggestion for the current step
  var autoSug = getAutoSuggestion(current, currentWord);
  var autoSugHtml = '';
  if (autoSug) {
    var sugColor = autoSug.suggest === 'yes' ? '#d4f0e0' : autoSug.suggest === 'no' ? '#fde8e8' : '#fef3cd';
    var sugBorder = autoSug.suggest === 'yes' ? '#a8d5b8' : autoSug.suggest === 'no' ? '#e0b898' : '#e0c97a';
    var sugTextColor = autoSug.suggest === 'yes' ? '#1a6b3a' : autoSug.suggest === 'no' ? '#7b3f20' : '#7a5a00';
    autoSugHtml = '<div style="margin:6px 0 8px;padding:7px 11px;background:' + sugColor
      + ';border-left:3px solid ' + sugBorder + ';border-radius:4px;font-size:.79rem;color:' + sugTextColor + '">'
      + '⚡ ' + autoSug.msg + '</div>';
  }

  var html = '<div class="card">'+bcHtml()
    +'<div class="step-label">'
    +getStepLabel(current, node.step)+'</div>'
    +'<div class="question">'+node.q()+'</div>'
    +'<div class="hint">'+node.hint()+'</div>'
    +freqHtml(node.freq)+refHtml(node)+hintHtml+autoSugHtml;

  if (node.options) {
    html += '<div class="opts-col">';
    node.options.forEach(function(opt, idx){
      var fs = getFormalStatus(opt.next, currentWord);
      var disabled = fs.status === 'impossible';
      var extraStyle = disabled
        ? 'opacity:.45;cursor:not-allowed;text-decoration:line-through;background:#f8f0f0;border-color:#e0b8b8;color:#888'
        : fs.status === 'unlikely'
          ? 'border-color:#e0c97a;background:#fefaed'
          : '';
      var badge = disabled
        ? ' <span style="font-size:.68rem;background:#fde8e8;color:#8b2020;padding:1px 6px;border-radius:8px;vertical-align:middle">' + L('⛔ невозможно','⛔ impossible') + '</span>'
        : fs.status === 'unlikely'
          ? ' <span style="font-size:.68rem;background:#fef3cd;color:#7a5a00;padding:1px 6px;border-radius:8px;vertical-align:middle">' + L('⚠ маловероятно','⚠ unlikely') + '</span>'
          : '';
      var reasonTip = fs.reason ? ' title="' + fs.reason.replace(/"/g,'&quot;') + '"' : '';
      var shortcut = '<span style="float:right;font-size:.65rem;color:#bbb;margin-left:8px">' + (idx+1) + '</span>';
      html += '<button class="btn-opt"' + reasonTip
        + (disabled ? ' disabled onclick="return false"' : ' onclick="goResult(\''+opt.next+'\',\''+opt.label().replace(/'/g,'&#39;').replace(/"/g,'&quot;')+'\')"')
        + ' style="' + extraStyle + '">'
        + shortcut + opt.label() + badge + '</button>';
    });
    html += '<div style="font-size:.68rem;color:#bbb;margin-top:4px">'
      + L('Клавиши 1–7 для выбора','Keys 1–7 to select') + '</div>';
    html += '</div>';
  } else {
    var yl = L('Да →','Yes →') + '<span style="float:right;font-size:.65rem;color:rgba(255,255,255,.6);margin-left:8px">Enter / →</span>';
    var nl = L('Нет →','No →') + '<span style="float:right;font-size:.65rem;color:rgba(120,50,0,.5);margin-left:8px">Backspace / ←</span>';
    html += '<div class="btn-row">'
      +'<button class="btn btn-yes" id="btn-yes-main" onclick="goNode(\''+node.yes+'\',\''+L('Да →','Yes →')+'\',true)">'+yl+'</button>'
      +'<button class="btn btn-no"  id="btn-no-main"  onclick="goNode(\''+node.no+'\',\''+L('Нет →','No →')+'\',false)">'+nl+'</button>'
      +'</div>';
  }
  html += '</div>';
  document.getElementById('main-area').innerHTML = html;
}

function recordStep(qFull, label, isYes) {
  var qShort = qFull.replace(/<[^>]+>/g,'').substring(0,50)+'…';
  stepHistory.push({qShort:qShort, label:label, yes:isYes});
}

function goNode(nextId, label, isYes) {
  var node = NODES[current];
  recordStep(node.q(), label, isYes);
  if (nextId.startsWith('r_')) { renderResult(nextId); }
  else if (NODES[nextId]) { current = nextId; render(); }
  else { renderResult(nextId); }
}

function goResult(id, label) {
  var node = NODES[current];
  recordStep(node.q(), label, true);
  renderResult(id);
}

function findWrongStep(userResultKey, canonKey, steps) {
  // Results where step 1 should be 'Yes' (first member IS an avyaya/preverb)
  var startYesResults = {
    'r_avyayibhava':1, 'r_tp_pradi':1, 'r_bv_pradi':1
  };

  // DFS to find path from 'start' to canonKey
  // preferNoAtStart: for most results, the correct path starts with No at step 1
  function pathTo(target, nodeId, path, preferNo) {
    if (nodeId === target) return path;
    if (!nodeId || nodeId.startsWith('r_')) return null;
    var node = NODES[nodeId];
    if (!node) return null;
    if (node.options) {
      for (var i = 0; i < node.options.length; i++) {
        var opt = node.options[i];
        if (opt.next === target) return path.concat([{nodeId:nodeId, choice:opt.label(), isOption:true}]);
      }
      return null;
    }
    if (node.yes === target) return path.concat([{nodeId:nodeId, choice:L('Да →','Yes →'), isYes:true}]);
    if (node.no  === target) return path.concat([{nodeId:nodeId, choice:L('Нет →','No →'), isYes:false}]);
    // At 'start': respect the semantic preference
    var tryYesFirst = (nodeId === 'start') ? !preferNo : true;
    var first  = tryYesFirst ? node.yes : node.no;
    var second = tryYesFirst ? node.no  : node.yes;
    var firstLabel  = tryYesFirst ? L('Да →','Yes →') : L('Нет →','No →');
    var secondLabel = tryYesFirst ? L('Нет →','No →') : L('Да →','Yes →');
    var fromFirst = pathTo(target, first,  path.concat([{nodeId:nodeId, choice:firstLabel,  isYes:tryYesFirst}]), preferNo);
    if (fromFirst) return fromFirst;
    return pathTo(target, second, path.concat([{nodeId:nodeId, choice:secondLabel, isYes:!tryYesFirst}]), preferNo);
  }
  if (!steps || !steps.length) return null;
  // Use No-first at start for most results; Yes-first for avyaya-type results
  var preferNo = !startYesResults[canonKey];
  var correctPath = pathTo(canonKey, 'start', [], preferNo);
  if (!correctPath) return null;
  for (var i = 0; i < Math.min(correctPath.length, steps.length); i++) {
    var cStep = correctPath[i];
    var uStep = steps[i];
    if (!uStep) break;
    // Compare choices
    var correctChoice = cStep.choice;
    if (uStep.label !== correctChoice) {
      return {
        stepNum: i + 1,
        userLabel: uStep.label,
        correctLabel: correctChoice,
        questionText: uStep.qShort   // the question that was asked at this step
      };
    }
  }
  return null;
}

function renderResult(id) {
  var r = RESULTS[id];
  updateSideHistory();
  document.getElementById('prog').style.width = '100%';

  // Log this word
  var resultLabel = r ? r.type() : id;
  var canon = lookupCanonical(currentWord);
  var autoVerdict = null, autoRef = null, autoRefKey = null;
  var wordWasTyped = currentWord && currentWord.trim().length > 0;
  var canonNotFound = wordWasTyped && !canon;  // typed but not in DB
  if (canon) {
    autoRefKey = canon.key;
    autoRef = RESULTS[canon.key] ? RESULTS[canon.key].type() + ' — ' + canon.src : canon.src;
    if (canon.note) autoRef += ' [' + canon.note + ']';
    autoVerdict = (id === canon.key) ? 'correct' : 'wrong';
  }
  var entryId = genId();
  var entryTs = Date.now();
  lastAnalyzedWord = currentWord;
  isResultState = true;
  wordLog.push({
    id: entryId,
    timestamp: entryTs,
    word: currentWord,
    result: resultLabel,
    resultKey: id,
    steps: stepHistory.slice(),
    verdict: autoVerdict,
    refResult: autoRef,
    refKey: autoRefKey,
    canonNotFound: canonNotFound
  });
  renderWordLog();
  if (adminMode) renderAdmin();

  if (!r) {
    document.getElementById('main-area').innerHTML =
      '<div class="card">'+bcHtml()+'<p>'+L('Неизвестный тип','Unknown type')+': '+id+'</p>'
      +'<button class="btn-restart" onclick="restart()">'+L('↺ Новое слово','↺ New word')+'</button></div>';
    return;
  }

  var refs = r.refs[lang] || r.refs.ru;
  var exRows = r.examples.map(function(e){
    return '<div class="ex-row"><span class="ex-iast">'+e.iast+'</span>'
      +'<span class="ex-comp">('+e.comp()+')</span>'
      +' : '+e.v+' — «⁠<em>'+e.t()+'</em>⁠» <span class="ex-src">'+e.src+'</span></div>';
  }).join('');
  var pairRows = r.pairs.map(function(p){
    return '<div class="pair-warn"><strong>⚠ '+L('Конфликт с','Conflict with')+' '+p.with+':</strong> '+p.note()+'</div>';
  }).join('');

  var dtStr = new Date(entryTs).toLocaleString([], {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  var idBadge = '<div style="text-align:right;font-size:.65rem;color:#aaa;margin-bottom:4px;font-style:normal">#'+entryId+' · '+dtStr+'</div>';
  document.getElementById('main-area').innerHTML =
    '<div class="result-card '+r.theme+'">'+idBadge+bcHtml()
    +'<div class="result-type">'+r.type()+'</div>'
    +'<div class="result-alt">'+r.alt()+'</div>'
    +'<div class="pat">'+L('Патанджали','Patañjali')+': <em>'+r.pat+'</em></div>'
    +'<div class="result-def">'+r.def()+'</div>'
    +'<div class="freq-row"><span class="freq-badge '+r.fdiff+'">'+r.freq()+'</span></div>'
    +'<div class="form-lbl">'+L('Формула виграхи','Vigraha formula')+':</div>'
    +'<div class="formula">'+r.formula()+'</div>'
    +'<div class="ex-block"><div class="ex-title">'+L('Примеры','Examples')+'</div>'+exRows+'</div>'
    +pairRows
    +'<div class="ref-chips" style="margin-top:9px">'+refs.map(function(s){return'<span class="ref-chip">'+s+'</span>'}).join('')+'</div>'
    +(function(){
      if (!canon) {
        if (!canonNotFound) return '';
        // Word was typed but not found in canonical DB
        return '<div style="margin-top:10px;padding:7px 10px;border-radius:6px;font-size:.79rem;'
          + 'border:1.5px solid #d4c9a8;background:#f5f0e6;color:#7a5a00">'
          + '⚐ ' + L('Слово «⁠'+currentWord+'⁠» не найдено в базе эталонов — результат не проверен.',
                      'Word «⁠'+currentWord+'⁠» not in reference database — result unverified.')
          + '</div>';
      }
      var correct = autoVerdict === 'correct';
      var borderColor = correct ? '#a8d5b8' : '#e0b898';
      var bgColor     = correct ? '#eaf4ee' : '#fdf0e8';
      var icon        = correct ? '✓' : '✗';
      var headline    = correct
        ? icon + ' ' + L('Верно — совпадает с эталоном', 'Correct — matches reference')
        : icon + ' ' + L('Расхождение с эталоном', 'Does not match reference');
      var refType   = RESULTS[canon.key] ? RESULTS[canon.key].type() : canon.key;
      var transHtml = canon.trans
        ? '<br><span style="font-size:.79rem;font-style:italic;color:#444">' + canon.trans + '</span>' : '';
      var noteHtml  = canon.note
        ? '<br><span style="color:#888;font-size:.75rem">' + L('Прим.','Note') + ': ' + canon.note + '</span>' : '';
      var wrongStepHtml = '';
      if (!correct) {
        var lastEntry = wordLog.length ? wordLog[wordLog.length-1] : null;
        var stepsToCheck = lastEntry ? lastEntry.steps : stepHistory;
        var ws = findWrongStep(id, canon.key, stepsToCheck);
        if (ws) {
          var qText = ws.questionText ? '<div style="color:#888;font-size:.72rem;margin-bottom:2px">' + ws.questionText + '</div>' : '';
          // For rūpaka: add explanation of WHY step 2 should be No
          var extraExplain = '';
          if (canon && (canon.key === 'r_km_rupaka') && ws.stepNum === 2) {
            extraExplain = '<div style="margin-top:4px;font-size:.74rem;color:#555;font-style:italic">'
              + L('Пояснение: vidyā и dhana действительно разные понятия. Но вопрос шага 2 спрашивает не о различии, а о <strong>типе отношения</strong>: dvandva = X и Y <em>перечисляются</em> рядом; rūpaka = X <strong>отождествляется</strong> с Y через eva (X есть Y). В rūpaka нет координации — есть идентификация.',
                'Explanation: vidyā and dhana are indeed different concepts. But step 2 asks not about difference, but about the <strong>type of relation</strong>: dvandva = X and Y are <em>enumerated</em> as co-equals; rūpaka = X is <strong>identified</strong> with Y via eva (X is Y). No coordination — only identification.')
              + '</div>';
          }
          wrongStepHtml = '<div style="margin-top:6px;padding:6px 9px;background:rgba(0,0,0,.06);border-radius:4px;font-size:.76rem;line-height:1.55">'
            + qText
            + L('↳ Ошибка на шаге','↳ Error at step') + ' <strong>' + ws.stepNum + '</strong>: '
            + L('вы ответили','you chose') + ' <span style="color:#8b2020;font-weight:500">' + ws.userLabel + '</span>'
            + ' — ' + L('нужно было','should have been') + ' <span style="color:#1a6b3a;font-weight:500">' + ws.correctLabel + '</span>'
            + extraExplain
            + '</div>';
        }
      }
      return '<div style="margin-top:10px;padding:9px 11px;border-radius:6px;font-size:.82rem;border:2px solid '+borderColor+';background:'+bgColor+'">'
        + '<strong>' + headline + '</strong><br>'
        + '<em>' + refType + '</em>'
        + ' <span style="font-size:.74rem;color:#777">— ' + canon.src + '</span>'
        + transHtml + noteHtml + wrongStepHtml + '</div>';
    })()
    +'<a class="vigraha-ref" href="#vigraha-table">→ '+L('Таблица всех формул виграхи (§§ 4–7)','All vigraha formulae (§§ 4–7)')+'</a>'
    +'<br><button class="btn-restart" onclick="restart()">'+L('↺ Новое слово','↺ New word')+'</button>'
    +'</div>';
}

function restart(keepWord) {
  stepHistory = [];
  if (!keepWord) currentWord = '';
  current = 'start';
  isResultState = false;
  document.getElementById('prog').style.width = '0%';
  var notice = document.getElementById('auto-restart-notice');
  if (notice) notice.remove();
  renderWordInput();
  render();
  updateSideHistory();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
document.getElementById('btn-'+lang).classList.add('active');
renderWordInput();
render();

// Global keyboard shortcuts
document.addEventListener('keydown', function(e) {
  // Don't fire when typing in the word input
  if (document.activeElement && document.activeElement.id === 'word-field') return;
  if (isResultState) return;

  var node = NODES[current];
  if (!node) return;

  if (node.options) {
    // Digit keys 1-7 select options
    var num = parseInt(e.key);
    if (num >= 1 && num <= node.options.length) {
      var opt = node.options[num-1];
      var fs = getFormalStatus(opt.next, currentWord);
      if (fs.status !== 'impossible') goResult(opt.next, opt.label());
    }
  } else {
    // Yes: Enter, ArrowRight, Y
    if (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'y' || e.key === 'Y') {
      e.preventDefault();
      goNode(node.yes, L('Да →','Yes →'), true);
    }
    // No: Backspace, ArrowLeft, N, Escape
    if (e.key === 'Backspace' || e.key === 'ArrowLeft' || e.key === 'n' || e.key === 'N' || e.key === 'Escape') {
      e.preventDefault();
      goNode(node.no, L('Нет →','No →'), false);
    }
  }
});
</script>

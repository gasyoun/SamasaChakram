<svg viewBox="0 0 610 430" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Klammer Serif', 'Charis SIL', Charis, 'Gentium Plus', Georgia, serif">
<title>Klammerdiagramm — śītoṣṇasukhaduḥkhadāḥ</title>
<desc>German-Indological bracket diagram of the five-member compound śīta-uṣṇa-sukha-duḥkha-dāḥ (BG 2.14): two coordinate dvandva pairs — A = śīta+uṣṇa, B = sukha+duḥkha, on one rung — coordinated as block C (a dvandva of dvandvas), then the upapada head dāḥ taken right-to-left as mirrored node D: giving cold-and-heat, pleasure-and-pain. II часть begins at dāḥ (asked). Unsandhied segmented members, full word form.</desc>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Самаса — тренажёр</title>
<style>
:root {
  --bg: #f9f7f2; --card: #ffffff; --border: #d4c9a8;
  --accent: #2e4057; --accent2: #3e6b8a;
  --green: #2d6a4f; --red: #c0392b; --amber: #b7770d;
  --shadow: 0 2px 14px rgba(0,0,0,0.09);
  --r: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: 'Georgia', serif; color: #222; min-height: 100vh; }

header { background: var(--accent); color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
header h1 { font-size: 1.1rem; font-weight: normal; }
header .sub { font-size: 0.77rem; opacity: 0.7; font-style: italic; }
.score-badge { background: rgba(255,255,255,0.15); border-radius: 20px; padding: 4px 14px; font-size: 0.85rem; }

nav { display: flex; gap: 0; border-bottom: 2px solid var(--border); background: #fff; }
.tab { padding: 11px 22px; cursor: pointer; font-family: 'Georgia', serif; font-size: 0.9rem;
       color: #777; border: none; background: none; border-bottom: 3px solid transparent;
       margin-bottom: -2px; transition: all 0.2s; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.tab:hover:not(.active) { color: var(--accent2); background: #f5f0e6; }

main { max-width: 820px; margin: 0 auto; padding: 28px 16px 60px; }

.panel { display: none; }
.panel.active { display: block; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
        padding: 26px; box-shadow: var(--shadow); margin-bottom: 20px; animation: fade 0.3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

.card-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #999; margin-bottom: 10px; }
.compound { font-size: 1.6rem; font-style: italic; color: var(--accent); margin-bottom: 6px; }
.compound-devan { font-size: 1.1rem; color: #888; margin-bottom: 12px; }
.prompt { font-size: 0.95rem; color: #444; margin-bottom: 16px; line-height: 1.6; }

.options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
@media (max-width: 540px) { .options { grid-template-columns: 1fr; } }

.opt-btn {
  padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--border);
  background: var(--card); cursor: pointer; font-family: 'Georgia', serif; font-size: 0.88rem;
  text-align: left; transition: all 0.18s; line-height: 1.4;
}
.opt-btn:hover:not(:disabled) { background: #f0ecdf; border-color: var(--accent2); }
.opt-btn.correct { background: #e6f4ec; border-color: var(--green); color: #1a4d35; }
.opt-btn.wrong   { background: #fdecea; border-color: var(--red); color: #7a1e1e; }
.opt-btn.reveal  { background: #e8f0e8; border-color: var(--green); opacity: 0.7; }
.opt-btn:disabled { cursor: default; }

.feedback { border-radius: 8px; padding: 14px 16px; margin-top: 8px; font-size: 0.9rem; line-height: 1.6; }
.feedback.correct { background: #e6f4ec; border-left: 4px solid var(--green); color: #1a4a2a; }
.feedback.wrong   { background: #fdecea; border-left: 4px solid var(--red); color: #7a1e1e; }
.feedback em { font-style: italic; }
.feedback strong { font-weight: bold; }

.btn-next { margin-top: 14px; background: var(--accent); color: #fff; border: none;
            padding: 10px 24px; border-radius: 6px; cursor: pointer;
            font-family: 'Georgia', serif; font-size: 0.9rem; transition: background 0.2s; }
.btn-next:hover { background: var(--accent2); }
.btn-next:disabled { background: #ccc; cursor: default; }

/* Vigraha trainer */
.vigraha-input { width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
                 border-radius: 6px; font-family: 'Georgia', serif; font-size: 1rem;
                 font-style: italic; margin-bottom: 10px; transition: border-color 0.2s; }
.vigraha-input:focus { outline: none; border-color: var(--accent2); }
.btn-check { background: var(--accent); color: #fff; border: none; padding: 9px 20px;
             border-radius: 6px; cursor: pointer; font-family: 'Georgia', serif; font-size: 0.88rem; }
.answer-reveal { margin-top: 12px; padding: 12px 14px; background: #f5f0e6;
                 border-radius: 6px; font-size: 0.9rem; line-height: 1.6; }
.answer-reveal .canon { font-size: 1.05rem; font-style: italic; color: var(--accent); }
.answer-reveal .trans { font-size: 0.85rem; color: #666; }

/* Long compound */
.long-cpd { font-size: 1.3rem; font-style: italic; color: var(--accent); line-height: 1.7;
            margin-bottom: 8px; word-break: break-all; }
.tree-area { font-family: 'Courier New', monospace; font-size: 0.85rem; color: #333;
             background: #f5f0e6; padding: 14px; border-radius: 6px; margin: 12px 0;
             white-space: pre; overflow-x: auto; }
.step-panel { margin: 10px 0; padding: 12px 14px; background: #f0f4f8; border-radius: 6px; }
.step-num { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: #999; }
.step-content { font-size: 0.9rem; line-height: 1.6; margin-top: 4px; }

/* Score panel */
.score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
.score-item { text-align: center; padding: 16px; background: var(--card); border: 1px solid var(--border);
              border-radius: var(--r); }
.score-item .num { font-size: 2.2rem; font-weight: bold; color: var(--accent); }
.score-item .lbl { font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 0.06em; }

.progress-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
.prog-dot { width: 14px; height: 14px; border-radius: 50%; background: #ddd; }
.prog-dot.ok { background: var(--green); }
.prog-dot.fail { background: var(--red); }
.prog-dot.cur { background: var(--amber); }

/* Context exercise */
.context-text { font-size: 0.95rem; font-style: italic; color: var(--accent2); margin: 10px 0 6px;
                padding: 10px 14px; background: #f5f0e6; border-radius: 6px; line-height: 1.7; }
.context-gloss { font-size: 0.8rem; color: #777; margin-bottom: 14px; line-height: 1.6; }
.highlight { background: #ffe8a0; padding: 1px 4px; border-radius: 3px; }

.mode-selector { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.mode-btn { padding: 8px 18px; border-radius: 20px; border: 1.5px solid var(--border);
            background: var(--card); cursor: pointer; font-family: 'Georgia', serif; font-size: 0.85rem;
            color: var(--accent); transition: all 0.2s; }
.mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Samāsa — тренажёр</h1>
    <div class="sub">Блоки 3, 4, 5: определение типа · виграха · длинные самасы · контекст</div>
  </div>
  <div class="score-badge" id="score-badge">0 / 0</div>
</header>

<nav>
  <button class="tab active" onclick="showTab('t1')">1. Определи тип</button>
  <button class="tab" onclick="showTab('t2')">2. Виграха</button>
  <button class="tab" onclick="showTab('t3')">3. Длинные самасы</button>
  <button class="tab" onclick="showTab('t4')">4. Контекст решает</button>
  <button class="tab" onclick="showTab('t5')">Прогресс</button>
</nav>

<main>

<!-- ══════════════════ TAB 1: Type identification ══════════════════ -->
<div class="panel active" id="t1">
  <div class="mode-selector">
    <button class="mode-btn active" onclick="setMode('all',this)">Все типы</button>
    <button class="mode-btn" onclick="setMode('tp',this)">Tatpuruṣa</button>
    <button class="mode-btn" onclick="setMode('bv',this)">Bahuvrīhi</button>
    <button class="mode-btn" onclick="setMode('km',this)">Karmadhāraya</button>
    <button class="mode-btn" onclick="setMode('en',this)">Английские</button>
    <button class="mode-btn" onclick="setMode('ru',this)">Русские</button>
  </div>
  <div id="q1-area"></div>
</div>

<!-- ══════════════════ TAB 2: Vigraha ══════════════════ -->
<div class="panel" id="t2">
  <div id="q2-area"></div>
</div>

<!-- ══════════════════ TAB 3: Long compounds ══════════════════ -->
<div class="panel" id="t3">
  <div id="q3-area"></div>
</div>

<!-- ══════════════════ TAB 4: Context ══════════════════ -->
<div class="panel" id="t4">
  <div id="q4-area"></div>
</div>

<!-- ══════════════════ TAB 5: Progress ══════════════════ -->
<div class="panel" id="t5">
  <div class="score-grid">
    <div class="score-item"><div class="num" id="s-correct">0</div><div class="lbl">Верно</div></div>
    <div class="score-item"><div class="num" id="s-total">0</div><div class="lbl">Всего</div></div>
    <div class="score-item"><div class="num" id="s-pct">—</div><div class="lbl">% верных</div></div>
  </div>
  <div class="progress-row" id="progress-dots"></div>
  <div id="mistakes-area"></div>
</div>

</main>

<script>
// ── SCORE ────────────────────────────────────────────────────────────────────
let score = { correct: 0, total: 0, history: [] };
function addScore(ok, item) {
  score.total++; if (ok) score.correct++;
  score.history.push({ ok, compound: item });
  document.getElementById('score-badge').textContent = `${score.correct} / ${score.total}`;
  updateProgress();
}
function updateProgress() {
  const dots = document.getElementById('progress-dots');
  dots.innerHTML = score.history.map(h => `<div class="prog-dot ${h.ok?'ok':'fail'}"></div>`).join('');
  document.getElementById('s-correct').textContent = score.correct;
  document.getElementById('s-total').textContent = score.total;
  document.getElementById('s-pct').textContent = score.total ? Math.round(score.correct/score.total*100)+'%' : '—';
  const mistakes = score.history.filter(h=>!h.ok);
  document.getElementById('mistakes-area').innerHTML = mistakes.length
    ? `<div class="card"><div class="card-title">Ошибки</div>${mistakes.map(m=>`<div style="margin-bottom:8px;font-style:italic;color:var(--red)">${m.compound}</div>`).join('')}</div>` : '';
}

// ── TAB SWITCHING ────────────────────────────────────────────────────────────
function showTab(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

let t1Mode = 'all';
let t1Pool = [], t1idx = 0, t1answered = false;

function setMode(mode, btn) {
  t1Mode = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  t1idx = 0; t1Pool = shufflePool(mode); t1answered = false;
  renderQ1();
}

function shufflePool(mode) {
  const pool = mode === 'all' ? TYPE_QUESTIONS : TYPE_QUESTIONS.filter(q => q.group === mode);
  return [...pool].sort(() => Math.random() - 0.5);
}

function renderQ1() {
  if (!t1Pool.length) t1Pool = shufflePool(t1Mode);
  const q = t1Pool[t1idx % t1Pool.length];
  const opts = [...q.opts].sort(() => Math.random() - 0.5);
  const area = document.getElementById('q1-area');
  t1answered = false;

  area.innerHTML = `
    <div class="card">
      <div class="card-title">Задание ${(t1idx % t1Pool.length) + 1} / ${t1Pool.length} — Определи тип</div>
      <div class="compound">${q.compound}</div>
      ${q.devan ? `<div class="compound-devan">${q.devan}</div>` : ''}
      <div class="prompt">Какому типу принадлежит это сложное слово?</div>
      <div class="options" id="opts1">
        ${opts.map(o => `<button class="opt-btn" onclick="checkQ1(this,'${o}','${q.label}','${q.hint.replace(/'/g,"\\'")}','${q.compound.replace(/'/g,"\\'")}','${q.para}')">${o}</button>`).join('')}
      </div>
      <div id="fb1"></div>
      <button class="btn-next" id="next1" onclick="nextQ1()" disabled>Следующее →</button>
    </div>`;
}

function checkQ1(btn, chosen, correct, hint, compound, para) {
  if (t1answered) return;
  t1answered = true;
  const ok = chosen === correct;
  document.querySelectorAll('#opts1 .opt-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent.trim() === correct) b.classList.add('correct');
    else if (b === btn && !ok) b.classList.add('wrong');
  });
  document.getElementById('fb1').innerHTML = `
    <div class="feedback ${ok?'correct':'wrong'}">
      <strong>${ok ? '✓ Верно!' : '✗ Нет.'}</strong><br>
      Тип: <em>${correct}</em><br>
      ${hint}<br>
      <span style="font-size:0.78rem;opacity:0.7">Источник: ${para}</span>
    </div>`;
  document.getElementById('next1').disabled = false;
  addScore(ok, compound);
}

function nextQ1() { t1idx++; renderQ1(); }

let t2idx = 0, t2pool = [], t2shown = false;

function renderQ2() {
  if (!t2pool.length) t2pool = [...VIGRAHA_QUESTIONS].sort(() => Math.random() - 0.5);
  const q = t2pool[t2idx % t2pool.length];
  t2shown = false;

    <div class="card">

      ${q.devan ? `<div class="compound-devan">${q.devan}</div>` : ''}
      <div class="prompt">Тип: <em>${q.type}</em> · Перевод: «${q.trans}»<br>Напиши формулу самаса-виграхи (IAST):</div>
      <input class="vigraha-input" id="v-input" placeholder="напр. rājñaḥ putraḥ" autocomplete="off" spellcheck="false"
             onkeydown="if(event.key==='Enter')checkV()">
      <div>
        <button class="btn-check" onclick="checkV()">Проверить</button>
        <button class="btn-check" style="margin-left:8px;background:var(--accent2)" onclick="showAnswer()">Показать ответ</button>
      </div>
      <div id="fb2"></div>
      <button class="btn-next" id="next2" onclick="nextQ2()" disabled>Следующее →</button>
    </div>`;
}

function normalize(s) { return s.toLowerCase().replace(/[^a-zāīūṛḥṃśṣṭḍṇñṅ ]/g,'').replace(/\s+/g,' ').trim(); }

function checkV() {
  const q = t2pool[t2idx % t2pool.length];
  const val = document.getElementById('v-input').value;
  const ok = normalize(val) === normalize(q.vigraha);
  const close = normalize(q.vigraha).split(' ').filter(w => normalize(val).includes(w)).length >= 1;
  document.getElementById('fb2').innerHTML = `
    <div class="answer-reveal">
      <div class="ex-title">Канонический ответ</div>
      <div class="canon">${q.vigraha}</div>
      <div class="trans">«${q.trans}» — ${q.note}</div>
      <div style="margin-top:6px;font-size:0.78rem;color:#888">Источник: ${q.para}</div>
      ${ok ? '<div style="color:var(--green);margin-top:6px">✓ Отличное совпадение!</div>'
           : close ? '<div style="color:var(--amber);margin-top:6px">Близко — сравни с каноническим ответом</div>'
           : '<div style="color:var(--red);margin-top:6px">Отличается — изучи формулу виграхи</div>'}
    </div>`;
  document.getElementById('next2').disabled = false;
  if (!t2shown) { addScore(ok, q.compound); t2shown = true; }
}

function showAnswer() {
  document.getElementById('v-input').value = t2pool[t2idx % t2pool.length].vigraha;
  checkV();
}

function nextQ2() { t2idx++; t2shown = false; renderQ2(); }

      <div class="compound">${q.compound}</div>
      <div class="context-text">${q.context}</div>
      <div class="context-gloss">${q.gloss}</div>
      <div class="prompt">${q.question}</div>
      <div id="opts4">
        ${q.opts.map(o => `<button class="opt-btn" style="margin-bottom:8px;width:100%;display:block"
          onclick="checkQ4(this,${o.correct},'${(o.correct?q.feedback_ok:q.feedback_fail).replace(/'/g,"\\'")}','${q.compound.replace(/'/g,"\\'")}','${q.para}')">${o.label}</button>`).join('')}
      </div>
      <div id="fb4"></div>
      <button class="btn-next" id="next4" onclick="nextQ4()" disabled>Следующее →</button>
    </div>`;
}

function checkQ4(btn, correct, feedback, compound, para) {
  if (t4answered) return;
  t4answered = true;
  btn.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    document.querySelectorAll('#opts4 .opt-btn').forEach(b => {
      if (b !== btn) b.classList.add('reveal');
    });
  }
  document.querySelectorAll('#opts4 .opt-btn').forEach(b => b.disabled = true);
  document.getElementById('fb4').innerHTML = `
    <div class="feedback ${correct?'correct':'wrong'}">
      <strong>${correct ? '✓ Верно!' : '✗ Нет.'}</strong><br>${feedback}<br>
      <span style="font-size:0.78rem;opacity:0.7">Источник: ${para}</span>
    </div>`;
  document.getElementById('next4').disabled = false;
  addScore(correct, compound);
}

function nextQ4() { t4idx++; renderQ4(); }

// ── INIT ─────────────────────────────────────────────────────
t1Pool = shufflePool('all');
renderQ1();
t2pool = [...VIGRAHA_QUESTIONS].sort(() => Math.random() - 0.5);
renderQ2();
renderQ3();
renderQ4();
</script>
